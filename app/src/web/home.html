<!doctype html>
<html lang="de" data-app="datebaenkli">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Datebänkli</title>
    <!--
      The Chalk head, identical on all six pages. It is copied rather than shared
      because `routes/pages.ts` has no template engine and deliberately does not
      want one — every page is served as a byte-for-byte constant.

      Order matters twice over: `theme.js` is a classic script so that it runs
      before first paint (a module would be deferred and the dark reader would
      get a white flash), and the stylesheets precede it only because CSS does
      not block it.
    -->
    <link rel="preload" href="/assets/fonts/source-sans-3-400-latin.woff2" as="font"
          type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/material-symbols-rounded-400.woff2" as="font"
          type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/assets/fonts.css" />
    <link rel="stylesheet" href="/assets/chalk-tokens.css" />
    <link rel="stylesheet" href="/assets/app.css" />
    <script src="/assets/theme.js"></script>
  </head>
  <body data-page="home">
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-badge mi" aria-hidden="true">database</span>
        <span class="wordmark">Datebänkli</span>
      </a>
      <nav class="topbar-actions">
        <!--
          **The bar, and it is the same bar on all five pages.** `mountNav()` in
          `util.js` marks the current entry and hides what a role cannot reach;
          `test/pages.test.mjs` asserts these five blocks have not drifted apart.
          Edit one, edit all — the test will tell you if you did not.

          It used to be five different bars: five orders, two names for the overview,
          and `/sql` unreachable from `/lesson` or `/roster` entirely. Each page had
          dropped its own link and kept the rest in whatever order it was written in,
          which is defensible per page and incoherent across five. **The current page
          is listed rather than removed** — that is the whole fix. A set that changes
          under you cannot be learned; a highlight that moves can.

          Links, not buttons: middle-click and ctrl-click work, and there is no
          `onclick` to wire in five scripts. The `?` argument at `login.html`.
        -->
        <a class="btn navlink" id="nav-overview" href="/" data-i18n="nav.overview">Übersicht</a>
        <a class="btn navlink" id="nav-sql" href="/sql" data-i18n="nav.sql">SQL-Editor</a>
        <a class="btn navlink" id="nav-exercises" href="/uebungen" data-i18n="nav.exercises">Übungen</a>
        <a class="btn navlink" id="nav-lesson" href="/lesson" data-i18n="nav.lesson">Lektion</a>
        <a class="btn navlink" id="nav-roster" href="/roster" data-i18n="nav.roster">Klassen</a>

        <!-- Everything right of here is about this session rather than about where
             you are, which is why the divider is here and not somewhere page-specific.
             A page's own actions belong to the page: `/sql` used to keep two of them
             in this strip, and that alone made its bar look unlike every other. -->
        <span class="topbar-sep" aria-hidden="true"></span>
        <!-- The language control. A segmented toggle rather than a `<select>` since
             0.10.5, matching the sister app Tscheggsch: with two options, a select
             hides half of them behind a click, and "English exists" is the one
             thing this control has to advertise.

             `role="group"` with two `aria-pressed` buttons, not a `radiogroup`:
             radio roles owe the reader arrow-key navigation, and a group of
             toggle buttons owes them nothing beyond Tab and Enter, which they
             already have. The label stays bilingual — it names the control's own
             subject, so translating it would hide it from the reader looking.

             `aria-pressed` is set by `apply()` in `i18n.js` and by nothing else,
             including this markup's own attribute, which is the pre-script
             fallback. Two owners for one state attribute is the trap recorded at
             the top of app.css. -->
        <div id="lang" class="lang-toggle" role="group" aria-label="Sprache / Language">
          <button type="button" data-lang="de" aria-pressed="true" lang="de">DE</button>
          <button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button>
        </div>
        <!-- No `data-i18n-attr`: `wireThemeToggle` owns this label, because it is the
             only thing that knows which way the toggle currently points. The German
             is the no-script fallback. -->
        <button id="theme" type="button" class="icon-btn mi"
                aria-label="Auf dunkles Design wechseln"></button>
        <!-- The handbook, and there are two of them. The markup carries the staff
             one and `mountNav()` swaps in `/handbuch-lernende` for a student: the
             `href` cannot branch here without breaking the identical bar above,
             which is the trade this whole block is built on. New tab, so a page
             behind this one survives. No `data-i18n` — both documents are German
             only, and `login.html` carries that argument. -->
        <a id="help" class="btn icon-btn help-link" href="/handbuch" target="_blank"
           rel="noopener" aria-label="Handbuch öffnen (neues Fenster)"
           title="Handbuch öffnen (neues Fenster)">?</a>
        <!-- Last, always: "sign out" must be in the same place on every page, and the
             right-hand end is the one place that cannot move when the bar wraps. -->
        <button id="logout" type="button" class="icon-btn mi" aria-label="Abmelden"
                title="Abmelden" data-i18n-attr="aria-label:nav.logout title:nav.logout"
                >logout</button>
      </nav>
    </header>

    <main class="page page-narrow">
      <h1 id="name">…</h1>
      <p class="role muted small" id="role"></p>
      <!--
        An account setting, and it used to sit in the navigation between
        "Klassen" and "Abmelden" — where it read as a sixth section of the app.
        It belongs beside the name and the role, which is what it is about.
        `home.js` hides it for a demo lease, whose password nobody will ever
        type again.
      -->
      <p><button id="change" class="small" data-i18n="home.password">Passwort ändern</button></p>

      <div id="content"></div>
    </main>

    <footer class="footer">
      <span class="footer-version" id="version"></span>
      <span class="footer-contact"><span data-i18n="footer.contact">Fragen oder Probleme:</span>
        <a href="mailto:philip.schaffner@kwi.ch">philip.schaffner@kwi.ch</a></span>
    </footer>

    <!-- The <title> carries no key: the product name is the same word in both
         locales, so a `home.title` would only be two identical catalogue rows. -->
    <script type="module" src="/assets/home.js"></script>
  </body>
</html>
